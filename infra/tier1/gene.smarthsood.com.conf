server {
    listen 443 ssl;
    server_name gene.smarthsood.com;

    client_max_body_size 500m;

    ssl_certificate /etc/letsencrypt/live/gene.smarthsood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gene.smarthsood.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wake {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/models/ {
        rewrite ^/api/models/(.*)$ /$1 break;
        proxy_pass http://api.13.126.245.2.nip.io;
        proxy_set_header Host api.13.126.245.2.nip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/depmap/ {
        rewrite ^/api/depmap/(.*)$ /$1 break;
        proxy_pass http://api.13.126.245.2.nip.io;
        proxy_set_header Host api.13.126.245.2.nip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/embeddings/ {
        rewrite ^/api/embeddings/(.*)$ /$1 break;
        proxy_pass http://api.13.126.245.2.nip.io;
        proxy_set_header Host api.13.126.245.2.nip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/affinity/ {
        rewrite ^/api/affinity/(.*)$ /$1 break;
        proxy_pass http://api.13.126.245.2.nip.io;
        proxy_set_header Host api.13.126.245.2.nip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name gene.smarthsood.com;
    return 301 https://$host$request_uri;
}
