apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: gene-web
type: Opaque
stringData:
  S3_BUCKET: gene-web-data
  S3_ENDPOINT_URL: ""  # Leave empty for AWS S3
  S3_ACCESS_KEY: ""  # Set via AWS IAM or environment variable
  S3_SECRET_KEY: ""  # Set via AWS IAM or environment variable
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: gene-web
type: Opaque
stringData:
  JWT_SECRET: change-me-in-production
  JWT_ALGORITHM: HS256
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: gene-web
type: Opaque
stringData:
  DATABASE_URL: ""  # PostgreSQL connection string for Prisma
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: gene-web
type: Opaque
stringData:
  REDIS_URL: redis://redis-elasticache:6379/0
