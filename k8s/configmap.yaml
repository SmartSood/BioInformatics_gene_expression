apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: gene-web
data:
  # Redis configuration (via ElastiCache in AWS)
  REDIS_URL: redis://redis-elasticache:6379/0
  
  # S3 storage configuration
  USE_S3: "true"
  S3_REGION: us-east-1
  
  # Python configuration
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-backend-config
  namespace: gene-web
data:
  MODEL_BACKEND_PORT: "8000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-backend-config
  namespace: gene-web
data:
  EMBEDDING_BACKEND_PORT: "8002"
  HF_HOME: /tmp/hf_cache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: depmap-backend-config
  namespace: gene-web
data:
  DEPMAP_BACKEND_PORT: "8001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: affinity-backend-config
  namespace: gene-web
data:
  AFFINITY_BACKEND_PORT: "8003"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-backend-config
  namespace: gene-web
data:
  AUTH_BACKEND_PORT: "3001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-frontend-config
  namespace: gene-web
data:
  WEB_FRONTEND_PORT: "3000"
