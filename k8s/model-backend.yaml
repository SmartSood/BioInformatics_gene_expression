# Model Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend-api
  namespace: gene-web
  labels:
    app: model-backend
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-backend
      component: api
  template:
    metadata:
      labels:
        app: model-backend
        component: api
    spec:
      containers:
        - name: model-backend
          image: smarthcnbl/gene-model:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: model-backend-config
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: S3_SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
# Model Backend API Service
apiVersion: v1
kind: Service
metadata:
  name: model-backend
  namespace: gene-web
  labels:
    app: model-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: model-backend
    component: api
---
# Model Backend Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend-worker
  namespace: gene-web
  labels:
    app: model-backend
    component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-backend
      component: worker
  template:
    metadata:
      labels:
        app: model-backend
        component: worker
    spec:
      containers:
        - name: model-backend-worker
          image: smarthcnbl/gene-model:latest
          imagePullPolicy: Always
          command: ["python", "-m", "rq.cli", "worker"]
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: S3_SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 8Gi
---
# Model Backend HPA (Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-backend-api-hpa
  namespace: gene-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-backend-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
