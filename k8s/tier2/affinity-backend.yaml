# Affinity Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affinity-backend-api
  namespace: gene-web
  labels:
    app: affinity-backend
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: affinity-backend
      component: api
  template:
    metadata:
      labels:
        app: affinity-backend
        component: api
    spec:
      containers:
        - name: affinity-backend
          image: smarthcnbl/gene-affinity:fbb466c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: affinity-backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: affinity-backend
  namespace: gene-web
  labels:
    app: affinity-backend
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
  selector:
    app: affinity-backend
    component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: affinity-backend-api-hpa
  namespace: gene-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: affinity-backend-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
