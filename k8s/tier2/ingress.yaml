# Frontend + auth live on Tier 1 now (always-on, PM2) - this ingress only
# routes to the compute backends that live on Tier 2.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gene-web-ingress
  namespace: gene-web
spec:
  ingressClassName: traefik
  rules:
    - host: api.EC2_PUBLIC_IP.nip.io
      http:
        paths:
          # model-backend's actual FastAPI router prefixes (verified against
          # apps/model_backend/routers/*.py) - every one of these must be
          # listed, since Traefik forwards the matched path unchanged with
          # no rewrite, and there's no catch-all route on the backend side.
          - path: /health
            pathType: Exact
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /models
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /jobs
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /experiments
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /dataset
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /datasets
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /train
            pathType: Prefix
            backend:
              service:
                name: model-backend
                port:
                  number: 8000
          - path: /embeddings
            pathType: Prefix
            backend:
              service:
                name: embedding-backend
                port:
                  number: 8002
          - path: /associations
            pathType: Prefix
            backend:
              service:
                name: depmap-backend
                port:
                  number: 8001
          - path: /affinity
            pathType: Prefix
            backend:
              service:
                name: affinity-backend
                port:
                  number: 8003
