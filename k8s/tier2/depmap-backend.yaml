# DepMap Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: depmap-backend-api
  namespace: gene-web
  labels:
    app: depmap-backend
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: depmap-backend
      component: api
  template:
    metadata:
      labels:
        app: depmap-backend
        component: api
    spec:
      containers:
        - name: depmap-backend
          image: smarthcnbl/gene-depmap:ed0c08f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: depmap-backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: depmap-backend
  namespace: gene-web
  labels:
    app: depmap-backend
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: depmap-backend
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: depmap-backend-worker
  namespace: gene-web
  labels:
    app: depmap-backend
    component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: depmap-backend
      component: worker
  template:
    metadata:
      labels:
        app: depmap-backend
        component: worker
    spec:
      containers:
        - name: depmap-backend-worker
          image: smarthcnbl/gene-depmap:ed0c08f
          imagePullPolicy: IfNotPresent
          # NOT `rq.cli worker` (defaults to the "default" queue, which
          # nothing ever enqueues to - associations.py enqueues to
          # "depmap" specifically). This is the purpose-built entrypoint
          # that already listens on the right queue.
          command: ["python", "-m", "apps.depmap_backend.workers.run_rq_worker"]
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            # depmap_worker.py's update_database() writes results back via
            # Prisma after computing them - was missing here (only added to
            # the API container earlier), so every job "succeeded" but
            # silently failed to persist its actual results.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
          # OOMKilled repeatedly at the original 1Gi limit - a single
          # association job loads the full 543MB expression CSV plus
          # model/GDSC/CTRP/PRISM metadata into pandas DataFrames, which
          # runs several times larger in memory than on disk. This only
          # runs during actual job processing (bursty), not sustained, so
          # a high limit here is cheap on a 16GB node.
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 6Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: depmap-backend-api-hpa
  namespace: gene-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: depmap-backend-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
