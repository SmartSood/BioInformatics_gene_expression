# Model Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend-api
  namespace: gene-web
  labels:
    app: model-backend
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-backend
      component: api
  template:
    metadata:
      labels:
        app: model-backend
        component: api
    spec:
      containers:
        - name: model-backend
          image: smarthcnbl/gene-model:706a4e0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: model-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: model-backend
  namespace: gene-web
  labels:
    app: model-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: model-backend
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend-worker
  namespace: gene-web
  labels:
    app: model-backend
    component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-backend
      component: worker
  template:
    metadata:
      labels:
        app: model-backend
        component: worker
    spec:
      containers:
        - name: model-backend-worker
          image: smarthcnbl/gene-model:706a4e0
          imagePullPolicy: IfNotPresent
          # NOT `rq.cli worker` (defaults to the "default" queue, which
          # nothing ever enqueues to - train.py enqueues to "train"
          # specifically). This is the purpose-built entrypoint that
          # already listens on the right queue.
          command: ["python", "-m", "apps.model_backend.workers.rq_worker"]
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-backend-api-hpa
  namespace: gene-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-backend-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
