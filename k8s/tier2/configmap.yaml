apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: gene-web
data:
  REDIS_URL: redis://redis-elasticache:6379/0
  USE_S3: "true"
  S3_BUCKET: gene-web-data
  # ap-south-1 is where the actual bucket lives (it was left at the
  # us-east-1 placeholder from before the region was decided, which
  # apparently boto3 tolerates via redirect handling but s3fs/aiobotocore
  # does not - it fails outright with a 403 rather than redirecting).
  S3_REGION: ap-south-1
  # s3_storage.py reads the custom S3_REGION above, but s3fs (used by
  # pandas/fsspec for direct s3:// reads) follows the standard AWS SDK
  # env vars instead, which were never set at all.
  AWS_DEFAULT_REGION: ap-south-1
  AWS_REGION: ap-south-1
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Tier 1's public address - the frontend calls Tier 2 cross-origin
  # (different host), so every FastAPI backend needs this in its CORS
  # allow-list or the browser blocks the response entirely.
  CORS_ALLOWED_ORIGINS: "http://13.207.189.132,http://localhost:3000,http://127.0.0.1:3000"
  # Must exactly match what Tier 1's auth_backend signs into every JWT
  # (apps/auth_backend/src/index.ts) - every backend here verifies both
  # claims and rejects the token otherwise.
  AUTH_JWT_ISSUER: "http://localhost:4000"
  AUTH_JWT_AUDIENCE: "mlapp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-backend-config
  namespace: gene-web
data:
  MODEL_BACKEND_PORT: "8000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-backend-config
  namespace: gene-web
data:
  EMBEDDING_BACKEND_PORT: "8002"
  HF_HOME: /tmp/hf_cache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: depmap-backend-config
  namespace: gene-web
data:
  DEPMAP_BACKEND_PORT: "8001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: affinity-backend-config
  namespace: gene-web
data:
  AFFINITY_BACKEND_PORT: "8003"
