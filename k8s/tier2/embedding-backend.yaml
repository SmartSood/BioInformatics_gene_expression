# Embedding Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-backend-api
  namespace: gene-web
  labels:
    app: embedding-backend
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: embedding-backend
      component: api
  template:
    metadata:
      labels:
        app: embedding-backend
        component: api
    spec:
      containers:
        - name: embedding-backend
          image: smarthcnbl/gene-embedding:91c54c1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: embedding-backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          # This is the biggest consumer on the node - HF model weights are
          # cached under HF_HOME. Bump this if your chosen embedding models
          # (ESM-2 / ProtBERT / etc.) exceed ~1.2Gi resident.
          resources:
            requests:
              cpu: 500m
              memory: 1.5Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-backend
  namespace: gene-web
  labels:
    app: embedding-backend
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: http
  selector:
    app: embedding-backend
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-backend-worker
  namespace: gene-web
  labels:
    app: embedding-backend
    component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: embedding-backend
      component: worker
  template:
    metadata:
      labels:
        app: embedding-backend
        component: worker
    spec:
      containers:
        - name: embedding-backend-worker
          image: smarthcnbl/gene-embedding:91c54c1
          imagePullPolicy: IfNotPresent
          # NOT `rq.cli worker` (defaults to the "default" queue, which
          # nothing ever enqueues to - embeddings.py enqueues to
          # "embedding" specifically). This is the purpose-built
          # entrypoint that already listens on the right queue.
          command: ["python", "-m", "apps.embedding_backend.workers.run_rq_worker"]
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: embedding-backend-config
          resources:
            requests:
              cpu: 500m
              memory: 1.5Gi
            limits:
              cpu: 2000m
              memory: 3Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embedding-backend-api-hpa
  namespace: gene-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embedding-backend-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
