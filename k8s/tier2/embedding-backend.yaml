# Embedding Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-backend-api
  namespace: gene-web
  labels:
    app: embedding-backend
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: embedding-backend
      component: api
  template:
    metadata:
      labels:
        app: embedding-backend
        component: api
    spec:
      containers:
        - name: embedding-backend
          image: smarthcnbl/gene-embedding:ed0c08f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: embedding-backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          # ESM2-650M alone is ~2.6Gi resident (650M params, float32) and
          # ProtBERT another ~1.7Gi, downloaded and cached in-process on
          # first use (local_files_only was removed - see
          # embedding_service.py) - the original 3Gi limit was sized before
          # confirming these models actually load, and would OOM
          # immediately once they do.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /docs
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-backend
  namespace: gene-web
  labels:
    app: embedding-backend
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: http
  selector:
    app: embedding-backend
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-backend-worker
  namespace: gene-web
  labels:
    app: embedding-backend
    component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: embedding-backend
      component: worker
  template:
    metadata:
      labels:
        app: embedding-backend
        component: worker
    spec:
      containers:
        - name: embedding-backend-worker
          image: smarthcnbl/gene-embedding:ed0c08f
          imagePullPolicy: IfNotPresent
          # NOT `rq.cli worker` (defaults to the "default" queue, which
          # nothing ever enqueues to - embeddings.py enqueues to
          # "embedding" specifically). This is the purpose-built
          # entrypoint that already listens on the right queue.
          command: ["python", "-m", "apps.embedding_backend.workers.run_rq_worker"]
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: embedding-backend-config
          # ESM2-650M alone is ~2.6Gi resident (650M params, float32) and
          # ProtBERT another ~1.7Gi, downloaded and cached in-process on
          # first use (local_files_only was removed - see
          # embedding_service.py) - this is the container that actually
          # runs compute_embeddings(), so it needs the most headroom.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 8Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embedding-backend-api-hpa
  namespace: gene-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embedding-backend-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
