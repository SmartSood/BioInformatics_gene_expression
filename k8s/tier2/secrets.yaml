# Placeholders only - never commit real values. Apply this once, then
# overwrite with `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -`
# (see infra/README.md) rather than editing this file with real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: gene-web
type: Opaque
stringData:
  DATABASE_URL: postgresql://gene_web:gene_web_password@postgres.gene-web.svc.cluster.local:5432/gene_web
---
# Must be the exact same JWT_SECRET as Tier 1's auth_backend - it signs
# tokens with this, every backend here verifies signatures with it.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: gene-web
type: Opaque
stringData:
  JWT_SECRET: change-me-to-match-tier1
