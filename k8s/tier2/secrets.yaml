# database-credentials is deliberately NOT defined here. It was previously
# a placeholder Secret in this file, and re-running `kubectl apply -f
# k8s/tier2/secrets.yaml` after setting the real DATABASE_URL silently
# clobbered it back to the placeholder value (postgres.gene-web.svc.cluster.
# local, which nothing listens on) - a real production outage. Manage it
# ONLY out-of-band, and never add it back to this file:
#   kubectl create secret generic database-credentials -n gene-web \
#     --from-literal=DATABASE_URL='<real value>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# See infra/README.md for the safe (never-printed) way to pipe it in.

# Must be the exact same JWT_SECRET as Tier 1's auth_backend - it signs
# tokens with this, every backend here verifies signatures with it.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: gene-web
type: Opaque
stringData:
  JWT_SECRET: change-me-to-match-tier1
