apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: gene-web
type: Opaque
stringData:
  JWT_SECRET: change-me-in-production
  JWT_ALGORITHM: HS256
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: gene-web
type: Opaque
stringData:
  DATABASE_URL: postgresql://gene_web:gene_web_password@postgres.gene-web.svc.cluster.local:5432/gene_web